[project]
name = "github-databricks-uploader"
version = "0.1.0"
description = "FastAPI service that transfers JSON bytes from GitHub to Databricks Unity Catalog volumes."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "httpx>=0.27,<1.0",
    "pydantic-settings>=2.4,<3.0",
    "python-dotenv>=1.0,<2.0",
    "databricks-sdk>=0.121.0,<0.122.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
